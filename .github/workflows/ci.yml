name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    steps:
      - name: Install bounded scanner runtime
        run: |
          if ! (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends ca-certificates git python3) >/tmp/apt-security.log 2>&1; then
            cat /tmp/apt-security.log
            exit 1
          fi
          rm -rf /var/lib/apt/lists/* /tmp/apt-security.log
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git-tracked repository files
        id: repository_scan
        shell: sh
        run: |
          set +e
          python3 tools/portfolio_security_scan.py --root . --mode repository > security-findings.txt
          status=$?
          cat security-findings.txt
          exit "$status"
      - name: Upload redacted findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portfolio-security-findings
          path: security-findings.txt
          if-no-files-found: error
          retention-days: 7

  test:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
          - debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-pip python3-setuptools python3-venv python3-wheel
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create virtual environment
        run: python3 -m venv --system-site-packages .venv
      - name: Install package without network build isolation
        run: .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests with resource warnings as errors
        run: .venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src tests tools
