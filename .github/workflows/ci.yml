name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
          - debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-pip python3-setuptools python3-venv python3-wheel
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Create virtual environment
        run: python3 -m venv --system-site-packages .venv
      - name: Install package without network build isolation
        run: .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests with resource warnings as errors
        run: .venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src tests
