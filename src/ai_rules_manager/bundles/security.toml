[[rules]]
id = "security.no-secrets-in-context"
title = "No Secrets in Agent Context"
scope = "security"
priority = 1000
key = "security.secret_context"
value = "deny"
category = "security"
instruction = "Never write credentials, private keys, session cookies or live tokens into AGENTS.md, planning files, prompts, logs or generated reports."
tags = ["secrets"]

[[rules]]
id = "security.codex-io.no-live-db-mutation"
title = "Do Not Modify Active Codex Databases"
scope = "security"
priority = 995
key = "codex.local_database.live_mutation"
value = "forbidden"
category = "codex-local-io"
instruction = "Never modify, checkpoint, vacuum, delete, move, replace or add triggers to Codex SQLite databases while any Codex Desktop, CLI, app-server, IDE integration or remote-control process is running. Refuse maintenance on NFS, SMB, SSHFS, DrvFS, 9p and Windows-mounted paths."
tags = ["codex", "sqlite", "safety"]

[[rules]]
id = "security.filesystem.repository-scope"
title = "Repository Scope Only"
scope = "security"
priority = 994
key = "filesystem.scope"
value = "repository-only"
category = "filesystem"
instruction = "Treat the canonical Git repository root as the maximum default filesystem scope. Never recursively inspect or mutate /, the user home, mount roots or repository parents. Reject symlink and path traversal escapes."
tags = ["filesystem", "containment"]

[[rules]]
id = "security.filesystem.destructive-confirmation"
title = "Confirm Destructive Operations"
scope = "security"
priority = 993
key = "filesystem.destructive_confirmation"
value = "required"
category = "filesystem"
instruction = "Never automatically execute rm -rf, git clean -fdx, git reset --hard, recursive deletion, filesystem formatting or bulk replacement. Produce a canonical target manifest and require explicit action-time confirmation before destructive execution."
tags = ["deletion", "safety"]

[[rules]]
id = "security.codex.no-full-access-default"
title = "No Full Access by Default"
scope = "security"
priority = 992
key = "codex.sandbox.default"
value = "workspace-write-on-request"
category = "sandbox"
instruction = "Default to workspace-write with on-request approval. Do not use danger-full-access or approval policy never unless the user explicitly scopes and accepts the risk for a single task."
tags = ["sandbox", "least-privilege"]

[[rules]]
id = "security.codex-io.bounded-hook-frequency"
title = "Bound Codex Hook Frequency"
scope = "security"
priority = 990
key = "codex.hooks.frequency"
value = "bounded"
category = "codex-local-io"
instruction = "Project hooks must not run on every streamed token, network event, file read, shell command or tool invocation. Minimal mode permits only SessionStart and PreCompact; higher-frequency hooks require an explicitly selected context mode."
tags = ["codex", "hooks", "io"]

[[rules]]
id = "security.codex-io.read-only-hooks"
title = "Keep Project Hooks Read-only"
scope = "security"
priority = 985
key = "codex.hooks.io_mode"
value = "read-only"
category = "codex-local-io"
instruction = "Project hooks may read only bounded, HMAC-attested project state. They must never write under CODEX_HOME, invoke sqlite3, checkpoint or vacuum a database, modify triggers, rotate Codex internal files, start background processes or recursively scan the repository."
tags = ["codex", "hooks", "sqlite"]

[[rules]]
id = "security.review-hooks"
title = "Review Lifecycle Hooks"
scope = "security"
priority = 980
key = "security.hook_trust"
value = "explicit-review"
category = "security"
instruction = "Treat every new or changed lifecycle hook as executable code; inspect the exact command and approve it explicitly before use."
tags = ["hooks", "supply-chain"]

[[rules]]
id = "security.codex-io.hook-budget"
title = "Enforce a Small Hook Resource Budget"
scope = "security"
priority = 975
key = "codex.hooks.resource_budget"
value = "small"
category = "codex-local-io"
instruction = "Each generated project hook must have a one-second hard timeout, emit at most 4 KiB, read only known files, perform no recursive search, create no persistent application log and fail open when optional state is unavailable."
tags = ["codex", "hooks", "performance"]

[[rules]]
id = "security.codex-io.explicit-maintenance"
title = "Require Explicit Offline SQLite Maintenance"
scope = "security"
priority = 970
key = "codex.database.maintenance"
value = "explicit-idle-local-only"
category = "codex-local-io"
instruction = "Normal coding, debugging, build, test, review and deployment requests must never trigger Codex database maintenance. Maintenance requires --apply, --experimental and --accept-diagnostic-loss, zero active Codex processes, a supported local filesystem, an exclusive lock, bounded backup space, integrity validation, checkpoint verification and a rollback path."
tags = ["codex", "maintenance", "sqlite"]

[[rules]]
id = "security.codex-io.no-repeat-inventory"
title = "Reuse Repository Inventory"
scope = "security"
priority = 965
key = "filesystem.inventory.repeat"
value = "reuse"
category = "codex-local-io"
instruction = "Do not repeat an equivalent repository inventory in the same session. Prefer git ls-files and directory-scoped ripgrep, reuse prior results unless Git HEAD, the index or requested scope changed, and never scan CODEX_HOME."
tags = ["codex", "scan", "io"]

[[rules]]
id = "security.process.resource-budget"
title = "Bound Background Resource Use"
scope = "security"
priority = 960
key = "process.resource_budget"
value = "bounded"
category = "process"
instruction = "Do not start unbounded background loops, recursive watchers, uncontrolled subagents or persistent child processes. Every long-running process needs a timeout, owner, stop condition and observable resource limit."
tags = ["process", "cpu", "memory", "io"]

[[rules]]
id = "security.read-only-default"
title = "Read-only Default"
scope = "security"
priority = 950
key = "security.execution_default"
value = "read-only"
category = "security"
instruction = "Prefer read-only inspection. Require an explicit task need before mutating infrastructure, repositories, accounts or production data."
tags = ["least-privilege"]
